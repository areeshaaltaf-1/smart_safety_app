name: smart_safety_app
description: "Smart Community Safety App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🔥 FIREBASE
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2

  # 🌍 MAP (OpenStreetMap)
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # 🧠 LOCAL DATABASE (Hive)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 📍 LOCATION
  geolocator: ^13.0.0

  # 📁 FILE STORAGE (images, cache)
  path_provider: ^2.1.2

  # 📷 CAMERA (YOU NEED THIS FOR INCIDENT PHOTO)
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true